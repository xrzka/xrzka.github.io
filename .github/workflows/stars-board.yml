name: stars-board

# GitHub 应用 Stars 榜（stars/ 子目录）的每日采集
# 采集器、前端、数据全在 stars/ 下，这里只负责定时跑 + 把数据提交回去

on:
  schedule:
    # 每天 02:17 UTC（北京 10:17）；GitHub 定时任务可能延迟几分钟到几十分钟
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: '强制回填日/周/月/年 baseline（首次运行会自己回填一次，平时不用勾）'
        type: boolean
        default: false
  push:
    # 只认采集器代码和本 workflow 的改动：数据提交（stars/data/**）不在列表里，
    # 否则 bot 提交数据 → 触发新一轮 → 又提交，自己转自己。
    paths:
      - 'stars/collect.mjs'
      - '.github/workflows/stars-board.yml'

permissions:
  contents: write

concurrency:
  group: stars-board
  cancel-in-progress: false

jobs:
  collect:
    # 兜底：即使 paths 过滤漏了，也不让 bot 自己的提交触发新一轮采集
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 检查 GITHUB_TOKEN 写权限
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          push=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
                      -H "Accept: application/vnd.github+json" \
                      "https://api.github.com/repos/$GITHUB_REPOSITORY" | jq -r '.permissions.push')
          if [ "$push" != "true" ]; then
            echo "::error title=缺少写权限::GITHUB_TOKEN 只有只读权限，采集完也提交不了快照。请到 Settings → Actions → General → Workflow permissions 选 “Read and write permissions” 并保存，然后在本页点 “Run workflow”（或随便推一次 stars/collect.mjs）重跑。"
            exit 1
          fi
          echo "token 具备写权限 ✓"

      - name: 采集并计算榜单
        working-directory: stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 首次运行（一个历史基准都没有、也没回填过）collect.mjs 会自己补一次 --backfill
        run: node collect.mjs ${{ inputs.backfill && '--backfill' || '' }}

      - name: 提交数据快照
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stars/data
          if git diff --cached --quiet; then
            echo "本次无数据变化"
            exit 0
          fi
          git commit -m "chore(stars): stars board $(date -u +%Y-%m-%d)"
          git push
